name: Build DH Shop & Delivery APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Installer le SDK Android
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Décompresser le projet Android
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "DH_Shop_Delivery_ANDROID_CLEAN.zip" | head -n 1)
          test -n "$ZIP_FILE"
          rm -rf android-project
          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

      - name: Construire l'APK
        working-directory: android-project/dh_android_clean
        run: |
          gradle --no-daemon assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: DH-Shop-Delivery-APK
          path: android-project/dh_android_clean/app/build/outputs/apk/debug/app-debug.apk
